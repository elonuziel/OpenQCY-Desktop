name: build

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - id: win11
            name: "Windows 11 (x64)"
            min-version: "10.0.22000.0"
            portable-artifact: "OpenQCY-Desktop-win-x64"
            installer-artifact: "OpenQCY-Desktop-Setup"
            installer-filename: "OpenQCY-Desktop-Setup"
          - id: win10
            name: "Windows 10 (x64)"
            min-version: "10.0.17763.0"
            portable-artifact: "OpenQCY-Desktop-win10-x64"
            installer-artifact: "OpenQCY-Desktop-Win10-Setup"
            installer-filename: "OpenQCY-Desktop-Win10-Setup"
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore tests/OpenQCY.Desktop.Tests.csproj

      - name: Run unit tests (protocol, models, migrations)
        run: dotnet test tests/OpenQCY.Desktop.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Restore desktop app
        run: dotnet restore OpenQCY.Desktop.csproj -r win-x64 -p:PublishReadyToRun=true

      - name: Build desktop app
        run: dotnet build OpenQCY.Desktop.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:TargetPlatformMinVersion=${{ matrix.min-version }} --no-restore

      - name: Publish portable build
        run: dotnet publish OpenQCY.Desktop.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:TargetPlatformMinVersion=${{ matrix.min-version }} --no-restore -o artifacts/publish

      - name: Publish diagnostic probe
        run: dotnet publish Diagnostics/OpenQCY.Probe/OpenQCY.Probe.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:PublishSingleFile=true -p:TargetPlatformMinVersion=${{ matrix.min-version }} -o artifacts/publish

      - name: Install pinned Inno Setup
        shell: pwsh
        run: ./scripts/install-inno.ps1

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version 0.2.0 -SkipPublish -TargetPlatformMinVersion "${{ matrix.min-version }}" -OutputBaseFilename "${{ matrix.installer-filename }}"

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.portable-artifact }}
          path: artifacts/publish

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.installer-artifact }}
          path: artifacts/installer/${{ matrix.installer-filename }}.exe
